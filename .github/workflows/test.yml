name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install
        run: |
          bun install --cwd web --frozen-lockfile
          bun run --cwd web playwright install --with-deps chromium-headless-shell
      # test:mod runs `claude plugin test`, which needs the Claude Code CLI but no login.
      - name: Install Claude Code
        run: bun add -g --trust @anthropic-ai/claude-code@2.1.331
      # Some tests commit to temp git repos.
      - name: Set a git identity
        run: |
          git config --global user.name "kb test"
          git config --global user.email "test@example.com"
      - run: bun test
      - run: bun run test:mod
      - run: bun run typecheck
      - name: The committed web/dist matches its sources
        run: |
          bun run build
          git add -N web/dist
          git diff --exit-code --stat -- web/dist
